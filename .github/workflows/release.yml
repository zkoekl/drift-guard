name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - name: Release notes from CHANGELOG
        id: notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if python3 scripts/release_notes.py "$ver" > "${RUNNER_TEMP}/release-notes.md"; then
            echo "file=${RUNNER_TEMP}/release-notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
          fi
      - name: Goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.1
          args: >-
            release --clean
            ${{ steps.notes.outputs.file != '' && format('--release-notes={0}', steps.notes.outputs.file) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
