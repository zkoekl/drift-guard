name: Bug
description: A defect in the command, the hooks, or the docs
title: "bug: "
body:
  - type: textarea
    id: summary
    attributes:
      label: What went wrong
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Commit or version, when you have one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: Commands, or the doc section.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: Only if you ran the command.
